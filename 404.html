<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı | Buse Digital AI Creative Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/media/marka/busedigital-logo.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#E7DDF0">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#faf8f8;color:#3d2e4d;font:16px/1.6 Inter,Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#E7DDF0;padding:14px max(20px,calc((100% - 1200px)/2));display:flex;align-items:center;gap:12px}
header a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#5f4b78}
header img{width:52px;height:52px;border-radius:50%}
header b{display:block;font-size:22px;letter-spacing:-.3px}
header span{font-size:11px;letter-spacing:.18em}
main{flex:1;display:grid;place-items:center;padding:48px 20px}
.box{max-width:560px;text-align:center}
.code{font-size:13px;letter-spacing:.3em;color:#76618F;font-weight:700}
h1{font-size:clamp(34px,6vw,52px);line-height:1.08;margin:10px 0 14px;color:#5f4b78;letter-spacing:-1px}
p{margin:0 0 28px;color:#5d5068}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:12px;font-weight:600;text-decoration:none}
.p{background:#76618F;color:#fff}.p:hover{background:#5f4b78}
.o{border:1.5px solid #cdbfd9;color:#3d2e4d;background:#fff}.o:hover{border-color:#76618F}
.btn:focus-visible{outline:3px solid #76618F;outline-offset:3px}
footer{padding:20px;text-align:center;font-size:13px;color:#6d6079}
footer a{color:#5f4b78}
</style>
</head>
<body>
<header><a href="/" aria-label="Buse Digital ana sayfa"><img src="/assets/media/marka/busedigital-logo.svg" alt=""><div><b>Buse Digital</b><span>AI CREATIVE STUDIO</span></div></a></header>
<main>
  <div class="box">
    <div class="code">404</div>
    <h1>Bu sayfa burada değil.</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfadan hizmetlere ve örnek çalışmalara kolayca ulaşabilirsiniz.</p>
    <div class="btns">
      <a class="btn p" href="/">Ana sayfaya dön</a>
      <a class="btn o" href="/hizmetlerim.html">Hizmetler</a>
      <a class="btn o" href="/#/iletisim">Ücretsiz Teklif Al</a>
    </div>
  </div>
</main>
<footer>Bir sorun olduğunu düşünüyorsanız: <a href="mailto:info@busedigitalstudio.com">info@busedigitalstudio.com</a></footer>
</body>
</html>
